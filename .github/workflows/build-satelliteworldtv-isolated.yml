name: Build SatelliteWorldTV APK (isolated)
on:
  push:
    branches:
      - satelliteworldtv-apk-build-20261113
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
      - name: Restore SatelliteWorldTV project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          base64 --decode satellite-build/source.tar.xz.b64 | tar -xJ -C source
          test -f source/app/build.gradle.kts
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle -p source --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee satellite-build/build.log
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SatelliteWorldTV-v0.4.0-debug-apk
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Save build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SatelliteWorldTV-build-log
          path: satellite-build/build.log
          if-no-files-found: ignore
          retention-days: 14
